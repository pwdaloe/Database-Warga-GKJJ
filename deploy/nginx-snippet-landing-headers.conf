# Header bersama untuk halaman "sedang disiapkan" (statis, tanpa skrip).
# Salin ke: /etc/nginx/snippets/gkjj-landing-headers.conf
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
# Halaman akan diganti saat aplikasi hidup: jangan di-cache lama.
add_header Cache-Control "no-cache" always;
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
