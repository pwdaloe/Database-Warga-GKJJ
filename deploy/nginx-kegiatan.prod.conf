# Nginx — kegiatan.gkjjakarta.org (web :3200 + API :4200 pada jalur /api)
# Menggantikan blok landing "sedang disiapkan" untuk domain ini (lihat DEPLOY_KEGIATAN.md).
# Sertifikat SUDAH ada (dibuat saat landing dipasang): /etc/letsencrypt/live/kegiatan.gkjjakarta.org/
#
# Salin ke : /etc/nginx/sites-available/kegiatan.gkjjakarta.org
# Aktifkan : ln -s /etc/nginx/sites-available/kegiatan.gkjjakarta.org /etc/nginx/sites-enabled/
#
# API di jalur yang sama (/api) supaya tidak perlu subdomain, DNS, dan sertifikat baru, dan tidak ada CORS lintas-asal.

server {
    listen 80;
    listen [::]:80;
    server_name kegiatan.gkjjakarta.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;     # Nginx 1.24 di VPS belum mengenal "http2 on;" (baru 1.25.1)
    listen [::]:443 ssl http2;
    server_name kegiatan.gkjjakarta.org;

    ssl_certificate     /etc/letsencrypt/live/kegiatan.gkjjakarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kegiatan.gkjjakarta.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Aplikasi internal pengurus: jangan diindeks; header dasar (API menambah header helmet sendiri)
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2M;

    # ── API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Pemeriksaan kesehatan (hanya untuk pemantauan; tidak membuka data)
    location = /health {
        proxy_pass http://127.0.0.1:4200/health;
        proxy_set_header Host $host;
    }

    # ── Web ───────────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass         http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
