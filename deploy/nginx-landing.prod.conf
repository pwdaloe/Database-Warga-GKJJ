# Nginx — Halaman "sedang disiapkan": my / kegiatan / majelis .gkjjakarta.org
# Statis, tanpa proses PM2 dan tanpa memori tambahan. Dibuat oleh deploy/landing/render.sh.
#
# Salin ke : /etc/nginx/sites-available/landing.gkjjakarta.org
# Aktifkan : ln -s /etc/nginx/sites-available/landing.gkjjakarta.org /etc/nginx/sites-enabled/
# SSL      : lihat deploy/LANDING_CERTBOT.md (satu sertifikat per domain)
#
# Ketika sebuah aplikasi resmi hidup, pisahkan blok domainnya ke berkas sendiri
# (contoh: nginx-jemaat.prod.conf) dan hapus dari berkas ini. Langkah: docs/PLATFORM.md, bagian "Mengganti landing dengan aplikasi"
#
# Catatan: add_header di dalam location MENIMPA add_header tingkat server, jadi header
# keamanan sengaja hanya di tingkat server dan location di bawah tidak menambah header.

# ── my.gkjjakarta.org — Portal Jemaat (nanti: proxy ke apps/portal :3100) ──
server {
    listen 80;
    listen [::]:80;
    server_name my.gkjjakarta.org;

    root /var/www/gkjj-landing/my.gkjjakarta.org;
    index index.html;

    include /etc/nginx/snippets/gkjj-landing-headers.conf;

    location = / { try_files /index.html =404; }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location / { return 404; }
}

# ── kegiatan.gkjjakarta.org — Sistem Kegiatan (nanti: web :3200, API :4200) ──
