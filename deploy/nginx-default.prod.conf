# Nginx — Penangkap host tidak dikenal (default_server)  [OPSIONAL, disarankan]
#
# Mengganti halaman "Welcome to nginx" dan menolak permintaan ke IP server atau ke domain
# liar yang diarahkan ke VPS ini, supaya tidak menampilkan aplikasi yang salah.
# Respons 444 = koneksi ditutup tanpa jawaban.
#
# SYARAT sebelum dipasang (lihat deploy/LANDING_CERTBOT.md, bagian "Penangkap default"):
#  - nonaktifkan /etc/nginx/sites-enabled/default (yang menampilkan halaman Nginx sekarang)
#  - tidak ada default_server lain:  grep -rn default_server /etc/nginx/
#  - SEMUA host yang dilayani VPS ini punya server_name eksplisit (jemaat, api, my, kegiatan,
#    majelis, dan www bila WordPress memang di VPS ini)
#
# Butuh Nginx >= 1.19.4 untuk "ssl_reject_handshake" (Ubuntu 24.04 membawa 1.24; Ubuntu 22.04 hanya 1.18
# dan memerlukan sertifikat self-signed dari paket ssl-cert sebagai gantinya). Cek: nginx -v

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
